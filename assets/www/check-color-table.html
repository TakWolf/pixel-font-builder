<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pixel Font Builder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        @font-face {
            font-family: demo-color-all-otf;
            src: url("../../build/demo/demo.color-all.otf.woff2");
        }
        @font-face {
            font-family: demo-colr-otf;
            src: url("../../build/demo/demo.colr.otf.woff2");
        }
        @font-face {
            font-family: demo-cbdt-otf;
            src: url("../../build/demo/demo.cbdt.otf.woff2");
        }
        @font-face {
            font-family: demo-sbix-otf;
            src: url("../../build/demo/demo.sbix.otf.woff2");
        }
        @font-face {
            font-family: demo-color-all-ttf;
            src: url("../../build/demo/demo.color-all.ttf.woff2");
        }
        @font-face {
            font-family: demo-colr-ttf;
            src: url("../../build/demo/demo.colr.ttf.woff2");
        }
        @font-face {
            font-family: demo-cbdt-ttf;
            src: url("../../build/demo/demo.cbdt.ttf.woff2");
        }
        @font-face {
            font-family: demo-sbix-ttf;
            src: url("../../build/demo/demo.sbix.ttf.woff2");
        }
        .color-table-all-otf {
            font-family: demo-color-all-otf, sans-serif;
        }
        .color-table-colr-otf {
            font-family: demo-colr-otf, sans-serif;
        }
        .color-table-cbdt-otf {
            font-family: demo-cbdt-otf, sans-serif;
        }
        .color-table-sbix-otf {
            font-family: demo-sbix-otf, sans-serif;
        }
        .color-table-all-ttf {
            font-family: demo-color-all-ttf, sans-serif;
        }
        .color-table-colr-ttf {
            font-family: demo-colr-ttf, sans-serif;
        }
        .color-table-cbdt-ttf {
            font-family: demo-cbdt-ttf, sans-serif;
        }
        .color-table-sbix-ttf {
            font-family: demo-sbix-ttf, sans-serif;
        }
        body {
            background-color: antiquewhite;
            padding: 16px;
        }
        .label {
            display: inline-block;
            margin-top: 12px;
            margin-left: 12px;
            margin-right: 12px;
            padding-left: 8px;
            padding-right: 8px;
            font-size: 14px;
            font-weight: bold;
            color: white;
            background-color: dodgerblue;
            border-radius: 8px;
        }
        .content {
            margin-left: 12px;
            margin-right: 12px;
            font-size: 48px;
        }
    </style>
</head>
<body>
    <span class="label">color-all-otf</span>
    <p class="content color-table-all-otf">ABCDEF ❤🩷🧡💛💚💙🩵💜🤎🖤🩶🤍</p>
    <span class="label">colr-otf</span>
    <p class="content color-table-colr-otf">ABCDEF ❤🩷🧡💛💚💙🩵💜🤎🖤🩶🤍</p>
    <span class="label">cbdt-otf</span>
    <p class="content color-table-cbdt-otf">ABCDEF ❤🩷🧡💛💚💙🩵💜🤎🖤🩶🤍</p>
    <span class="label">sbix-otf</span>
    <p class="content color-table-sbix-otf">ABCDEF ❤🩷🧡💛💚💙🩵💜🤎🖤🩶🤍</p>
    <br>
    <span class="label">color-all-ttf</span>
    <p class="content color-table-all-ttf">ABCDEF ❤🩷🧡💛💚💙🩵💜🤎🖤🩶🤍</p>
    <span class="label">colr-ttf</span>
    <p class="content color-table-colr-ttf">ABCDEF ❤🩷🧡💛💚💙🩵💜🤎🖤🩶🤍</p>
    <span class="label">cbdt-ttf</span>
    <p class="content color-table-cbdt-ttf">ABCDEF ❤🩷🧡💛💚💙🩵💜🤎🖤🩶🤍</p>
    <span class="label">sbix-ttf</span>
    <p class="content color-table-sbix-ttf">ABCDEF ❤🩷🧡💛💚💙🩵💜🤎🖤🩶🤍</p>
</body>
</html>
